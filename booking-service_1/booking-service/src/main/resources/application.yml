server:
  port: ${PORT:8080}

spring:
  application:
    name: booking-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/booking_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:booking_user}
    password: ${SPRING_DATASOURCE_PASSWORD:booking_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # schema managed via migration scripts
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false

redis:
  address: ${REDIS_ADDRESS:redis://localhost:6379}

logging:
  level:
    com.example.booking: INFO
    org.hibernate.SQL: WARN

jwt:
  secret: ${JWT_SECRET:dGlja2V0cy1ib29raW5nLXN5c3RlbS1qd3Qtc2VjcmV0LWtleS1mb3ItaG1hYy1zaGEyNTYtYWxnb3JpdGht}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

